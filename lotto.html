<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sloworld · 로또 번호 생성기</title>
<meta name="description" content="연금복권 스타일의 로또 번호 생성기. 재미로 즐기는 번호 추첨 시뮬레이션입니다.">
<meta name="google-adsense-account" content="ca-pub-2127159739328027">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2127159739328027" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --mustard: #EFC761;
    --mustard-deep: #E0AF3A;
    --mustard-soft: #FBF0D5;
    --ink: #17140F;
    --paper: #FFFDF8;
    --surface: #FFFFFF;
    --text-muted: #6B6255;
    --lavender: #C9B7E8;
    --lavender-soft: #F1EBFA;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }

  h1 { font-family: 'Archivo Black', sans-serif; font-weight: 400; }

  .topbar { background: var(--mustard); border-bottom: 3px solid var(--ink); }

  .nav-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .logo { font-family: 'Archivo Black', sans-serif; font-size: 18px; color: var(--ink); text-decoration: none; flex-shrink: 0; }

  .nav-links { display: flex; gap: 20px; flex: 1; font-size: 14px; font-weight: 600; }
  .nav-links a { color: var(--ink); text-decoration: none; opacity: 0.75; }
  .nav-links a:hover, .nav-links a.active { opacity: 1; text-decoration: underline; }

  .nav-cta {
    background: var(--ink); color: var(--mustard); font-size: 13.5px; font-weight: 700;
    padding: 9px 18px; border-radius: 999px; text-decoration: none; white-space: nowrap;
  }
  .nav-cta:hover { background: #000; }

  .stage {
    display: flex;
    justify-content: center;
    padding: 48px 20px 60px;
  }

  .ticket-container {
    background: var(--surface);
    width: 100%;
    max-width: 440px;
    padding: 36px 26px;
    position: relative;
    border: 3px solid var(--ink);
    border-radius: 20px;
  }

  .ticket-header {
    border-bottom: 3px solid var(--ink);
    margin-bottom: 20px;
    padding-bottom: 12px;
    position: relative;
  }

  .ticket-header .badge {
    display: inline-block;
    background: var(--mustard);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 11px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .ticket-header h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }

  .ticket-header .serial {
    font-family: 'Inter', monospace;
    font-size: 11px;
    color: var(--text-muted);
    position: absolute;
    top: -22px;
    right: 0;
  }

  .lotto-paper { position: relative; z-index: 1; }

  .row-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 8px 4px;
    border-bottom: 1px dashed #E7DFCE;
  }

  .row-label {
    font-weight: 800;
    font-style: italic;
    color: var(--text-muted);
    width: 26px;
  }

  .balls-wrapper { display: flex; gap: 8px; }

  .ball {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.05rem;
    color: var(--ink);
    background: var(--surface);
    border: 2.5px solid var(--ink);
  }

  .color-1 { background: var(--mustard); }
  .color-2 { background: var(--lavender-soft); }
  .color-3 { background: #F3D4CE; }
  .color-4 { background: var(--lavender); }
  .color-5 { background: #D7E8CE; }

  .ticket-footer {
    margin-top: 26px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: left;
    line-height: 1.6;
    border-top: 2px solid var(--ink);
    padding-top: 14px;
  }

  .ticket-footer a { color: var(--ink); font-weight: 700; }

  .btn-draw {
    margin-top: 22px;
    padding: 14px 40px;
    font-size: 1.05rem;
    font-weight: 800;
    background: var(--ink);
    color: var(--mustard);
    border: 3px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.12s ease, background 0.15s ease;
  }

  .btn-draw:hover { background: #000; transform: translateY(-1px); }
  .btn-draw:active { transform: translateY(0) scale(0.98); }

  footer.pagefoot {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 30px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  footer.pagefoot a { color: var(--text-muted); }

  @media (max-width: 860px) {
    .nav-links { display: none; }
  }

  @media (max-width: 400px) {
    .ball { width: 32px; height: 32px; font-size: 0.9rem; }
    .balls-wrapper { gap: 5px; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">✳ sloworld</a>
    <div class="nav-links">
      <a href="index.html">저녁메뉴 추천</a>
      <a href="lotto.html" class="active">로또 생성기</a>
      <a href="inquiry.html">제휴 문의</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <a href="inquiry.html" class="nav-cta">제휴 문의</a>
  </div>
</nav>

<div class="stage">
  <div class="ticket-container">
    <div class="ticket-header">
      <span class="serial" id="serial-num">TR-20260818-0001</span>
      <span class="badge">LOTTO 6/45</span>
      <h1>연금복권 스타일 로또 추첨기</h1>
    </div>

    <div class="lotto-paper" id="lotto-paper">
      <!-- 5줄 번호 -->
    </div>

    <div class="ticket-footer">
      * 본 권은 실제 복권이 아니며, 책임감 있는 이용을 위한 재미용 시뮬레이션입니다.<br>
      * 추첨일시: <span id="current-time"></span><br>
      * 판매점: sloworld Lucky Shop<br>
      * <a href="index.html">영유아 저녁메뉴 추천</a> · <a href="inquiry.html">제휴 및 비즈니스 문의</a>
    </div>

    <button class="btn-draw" onclick="drawAllRows()">PURCHASE / DRAW</button>
  </div>
</div>

<footer class="pagefoot">
  sloworld · <a href="privacy.html">개인정보처리방침</a>
</footer>

<script>
  function getBallColorClass(num) {
    if (num <= 10) return 'color-1';
    if (num <= 20) return 'color-2';
    if (num <= 30) return 'color-3';
    if (num <= 40) return 'color-4';
    return 'color-5';
  }

  function generateLottoNumbers() {
    const numbers = [];
    while (numbers.length < 6) {
      const num = Math.floor(Math.random() * 45) + 1;
      if (!numbers.includes(num)) numbers.push(num);
    }
    return numbers.sort((a, b) => a - b);
  }

  function updateTimeAndSerial() {
    const now = new Date();
    document.getElementById('current-time').innerText = now.toLocaleString();
    const randomSerial = 'TR-' + now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, '0') +
      String(now.getDate()).padStart(2, '0') + '-' +
      Math.floor(Math.random() * 9000 + 1000);
    document.getElementById('serial-num').innerText = randomSerial;
  }

  function drawAllRows() {
    const paper = document.getElementById('lotto-paper');
    paper.innerHTML = '';
    const alphabet = ['A', 'B', 'C', 'D', 'E'];

    for (let i = 0; i < 5; i++) {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row-container';

      const label = document.createElement('span');
      label.className = 'row-label';
      label.innerText = alphabet[i];
      rowDiv.appendChild(label);

      const ballsWrapper = document.createElement('div');
      ballsWrapper.className = 'balls-wrapper';

      generateLottoNumbers().forEach(num => {
        const ball = document.createElement('div');
        ball.className = `ball ${getBallColorClass(num)}`;
        ball.innerText = num;
        ballsWrapper.appendChild(ball);
      });

      rowDiv.appendChild(ballsWrapper);
      paper.appendChild(rowDiv);
    }
    updateTimeAndSerial();
  }

  drawAllRows();
</script>

</body>
</html>
