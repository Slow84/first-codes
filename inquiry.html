<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sloworld · 제휴 및 비즈니스 문의</title>
    <meta name="google-adsense-account" content="ca-pub-2127159739328027">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2127159739328027" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --mustard: #EFC761;
            --ink: #17140F;
            --paper: #FFFDF8;
            --surface: #FFFFFF;
            --text-muted: #6B6255;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        h1 { font-family: 'Archivo Black', sans-serif; font-weight: 400; }

        .topbar { background: var(--mustard); border-bottom: 3px solid var(--ink); }

        .nav-inner {
            max-width: 1120px; margin: 0 auto; padding: 14px 20px;
            display: flex; align-items: center; gap: 24px;
        }

        .logo { font-family: 'Archivo Black', sans-serif; font-size: 18px; color: var(--ink); text-decoration: none; flex-shrink: 0; }
        .nav-links { display: flex; gap: 20px; flex: 1; font-size: 14px; font-weight: 600; }
        .nav-links a { color: var(--ink); text-decoration: none; opacity: 0.75; }
        .nav-links a:hover, .nav-links a.active { opacity: 1; text-decoration: underline; }
        .nav-cta {
            background: var(--ink); color: var(--mustard); font-size: 13.5px; font-weight: 700;
            padding: 9px 18px; border-radius: 999px; text-decoration: none; white-space: nowrap;
        }
        .nav-cta:hover { background: #000; }

        .stage { display: flex; justify-content: center; padding: 48px 20px 60px; }

        .form-container {
            background: var(--surface);
            padding: 36px 32px;
            border-radius: 20px;
            border: 3px solid var(--ink);
            max-width: 560px;
            width: 100%;
        }

        h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }

        p.subtitle { color: var(--text-muted); text-align: center; margin-bottom: 28px; font-size: 13.5px; }

        .form-group { margin-bottom: 18px; }

        label { display: block; margin-bottom: 7px; font-weight: 700; font-size: 13.5px; color: var(--ink); }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 2px solid var(--ink);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            background: var(--paper);
        }

        textarea { height: 140px; resize: vertical; }

        button {
            width: 100%;
            padding: 14px;
            background: var(--ink);
            color: var(--mustard);
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.12s ease;
        }

        button:hover { background: #000; transform: translateY(-1px); }
        button:active { transform: translateY(0) scale(0.98); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text-muted);
            text-decoration: underline;
            font-size: 13px;
        }

        footer.pagefoot {
            max-width: 1080px; margin: 0 auto; padding: 0 20px 30px;
            text-align: center; font-size: 12.5px; color: var(--text-muted);
        }
        footer.pagefoot a { color: var(--text-muted); }

        @media (max-width: 860px) { .nav-links { display: none; } }
    </style>
</head>
<body>

<nav class="topbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">✳ sloworld</a>
    <div class="nav-links">
      <a href="index.html">저녁메뉴 추천</a>
      <a href="lotto.html">로또 생성기</a>
      <a href="inquiry.html" class="active">제휴 문의</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <a href="inquiry.html" class="nav-cta">제휴 문의</a>
  </div>
</nav>

<div class="stage">
<div class="form-container">
    <h1>🤝 제휴 및 비즈니스 문의</h1>
    <p class="subtitle">협업 제안이나 문의사항을 남겨주시면 검토 후 연락드리겠습니다.</p>

    <form action="https://formspree.io/f/xwleqoak" method="POST">
        <div class="form-group">
            <label for="name">성함 / 업체명</label>
            <input type="text" id="name" name="name" placeholder="이름 또는 회사명을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="email">회신받을 이메일</label>
            <input type="email" id="email" name="_replyto" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="category">문의 유형</label>
            <select id="category" name="category">
                <option value="제휴문의">광고/제휴 문의</option>
                <option value="기술문의">시스템/기술 문의</option>
                <option value="기타">기타 문의</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">문의 내용</label>
            <textarea id="message" name="message" placeholder="자세한 문의 내용을 적어주세요" required></textarea>
        </div>

        <input type="hidden" name="_subject" value="새로운 제휴 문의가 접수되었습니다!">

        <button type="submit">문의 보내기</button>
    </form>

    <a href="index.html" class="back-link">← 메인으로 돌아가기</a>
</div>
</div>

<footer class="pagefoot">
  sloworld · <a href="privacy.html">개인정보처리방침</a>
</footer>

</body>
</html>
