<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-adsense-account" content="ca-pub-2127159739328027">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        .form-container {
            background: var(--bg);
            padding: 36px 32px;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: 700; font-size: 13.5px; }
        input[type="text"], input[type="email"], select, textarea {
            width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
            box-sizing: border-box; font-size: 14px; font-family: inherit; background: var(--bg-soft);
        }
        textarea { height: 140px; resize: vertical; }
        .back-link { display: block; text-align: center; margin-top: 18px; color: var(--text-muted); text-decoration: underline; font-size: 13px; }
    </style>
</head>
<body>

<nav class="topbar">
  <div class="nav-inner">
    <a href="/index.html" class="logo">sloworld</a>
    <div class="nav-links">
      <a href="/economy/index.html">Economy</a>
      <a href="/life/index.html">Life</a>
      <a href="/etc/lotto.html">Etc</a>
    </div>
    <a href="/inquiry.html" class="nav-cta">제휴 문의</a>
  </div>
</nav>

<section class="section soft">
<div class="form-container">
    <span class="eyebrow" style="display:block; text-align:center;">문의</span>
    <h1 style="font-size: 22px; text-align:center; margin-bottom: 8px;">제휴 및 비즈니스 문의</h1>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 28px; font-size: 13.5px;">협업 제안이나 문의사항을 남겨주시면 검토 후 연락드리겠습니다.</p>

    <form action="https://formspree.io/f/xwleqoak" method="POST">
        <div class="form-group">
            <label for="name">성함 / 업체명</label>
            <input type="text" id="name" name="name" placeholder="이름 또는 회사명을 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="email">회신받을 이메일</label>
            <input type="email" id="email" name="_replyto" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
            <label for="category">문의 유형</label>
            <select id="category" name="category">
                <option value="제휴문의">광고/제휴 문의</option>
                <option value="기술문의">시스템/기술 문의</option>
                <option value="기타">기타 문의</option>
            </select>
        </div>
        <div class="form-group">
            <label for="message">문의 내용</label>
            <textarea id="message" name="message" placeholder="자세한 문의 내용을 적어주세요" required></textarea>
        </div>
        <input type="hidden" name="_subject" value="새로운 제휴 문의가 접수되었습니다!">
        <button type="submit" class="pill-btn accent" style="width: 100%; justify-content: center;">문의 보내기</button>
    </form>

    <a href="/index.html" class="back-link">← 메인으로 돌아가기</a>
</div>
</section>

<footer class="pagefoot">

</footer>

</body>
</html>
